version: 1.0.0
# Versioned price table (ADR-007 D-6). estimated_cost on every Call Record derives from token counts
# x these per-1K-token rates, so cost governance is automatic and historical cost stays reproducible
# (the pricing version is recorded per Run). Rates are illustrative USD-per-1K-tokens; real values are
# set per environment. Adding/repricing a model = edit this file + bump the version. No code change.
currency: USD
unit_tokens: 1000
default:
  input_per_unit: 0.0
  output_per_unit: 0.0
models:
  gpt-5.5:
    input_per_unit: 0.005
    output_per_unit: 0.015
  claude-sonnet-5:
    input_per_unit: 0.003
    output_per_unit: 0.015
  gemini-2.5-pro:
    input_per_unit: 0.00125
    output_per_unit: 0.005
