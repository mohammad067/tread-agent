symbol: BTC
display_name: Bitcoin
asset_class: crypto
regime_sensitivity: high
decimals: 2
trading_hours: 24/7
staleness_threshold_minutes: 15
noise_threshold:
  k: 1.0
  floor_pct: { "6h": 1.0, "24h": 1.5 }
price_sources:
  aggregation: median
  min_sources: 2
  max_deviation_pct: 0.5
indicators: [rsi_14, macd, ema_20_50, atr_pct, volume_ratio_20d]
rules_dir: rules/assets/btc/


# کلاس: crypto
# حساسیت به رژیم جهانی: High
# معاملات: 24/7
# اگر قیمت بیشتر از 15 دقیقه قدیمی باشد → stale
#
# آستانه نویز:
# - 6 ساعته: 1%
# - 24 ساعته: 1.5%
# (کمتر از این = نویز)
#
# قیمت از چند منبع با Median
# هدف 3 منبع؛ حداقل 2 منبع فقط در صورت توافق در آستانه
# اگر انحراف بیشتر از 0.5% باشد → Flag
#
# اندیکاتورها:
# - RSI-14
# - MACD
# - EMA20
# - EMA50
# - ATR%
# - Volume Ratio
