name: ci

# CI is live from Milestone 3 (§12). Gates: lint -> format -> typecheck -> import-boundary
# -> unit/contract/golden/property tests -> coverage. LLM is never invoked (none exists yet);
# no network, no database in the deterministic-core test suite.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Frozen stack targets 3.12+; code is forward-compatible from 3.10.
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format check
        run: python -m ruff format --check src tests

      - name: Mypy (strict)
        run: python -m mypy

      - name: Import boundary (Clean Architecture)
        run: lint-imports

      - name: Tests + coverage
        run: python -m pytest --cov --cov-report=term-missing
